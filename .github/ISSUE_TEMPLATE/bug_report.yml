name: Bug report
description: Report incorrect backend or API behavior
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private keys, or personal data.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: Describe the incorrect behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include a minimal test or request that uses mocked upstream responses where possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node.js and package versions
    validations:
      required: true
