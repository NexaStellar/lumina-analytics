version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: lumina-db
    environment:
      POSTGRES_USER: lumina
      POSTGRES_PASSWORD: lumina_password
      POSTGRES_DB: lumina
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumina"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lumina-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lumina-backend
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://lumina:lumina_password@postgres:5432/lumina
      REDIS_URL: redis://redis:6379
      HORIZON_URL: https://horizon-testnet.stellar.org
      SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      NETWORK: testnet
      API_PORT: 4000
      WS_PORT: 4001
    ports:
      - "4000:4000"
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lumina-frontend
    environment:
      VITE_API_URL: http://localhost:4000
      VITE_WS_URL: ws://localhost:4001
      VITE_NETWORK: testnet
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: lumina-network
